  let r; update(db => { const w = me(db), b = db.buildings.find(x => x.ownerId === w.id && x.tipe === 'rumah'); if (!kavSel || !b) { r = { ok: false, msg: 'Pilih kavling dulu.' }; return; }
    if (!FYX.kavlingKosong(db).some(k => k.x === kavSel.x && k.y === kavSel.y)) { r = { ok: false, msg: 'Kavling sudah terisi.' }; return; } const p = debit(db, 'w:' + w.id, 25000, 'Biaya pindah rumah', 'Pembangunan'); if (!p.ok) { r = p; return; }
    b.x = kavSel.x; b.y = kavSel.y; const k = FYX.wilOfTile(db, b.x, b.y); if (k && k.jenis === 'Kawasan Perumahan' && k.id !== w.kawasan) { w.kawasan = k.id; w.rumah.nomor = Math.max(0, ...db.warga.filter(q => q.kawasan === k.id && q.id !== w.id).map(q => q.rumah.nomor)) + 1; } setAct(w, 'Pindah rumah'); log(db, w.nama, 'Pindah rumah ke (' + b.x + ',' + b.y + ')'); r = { ok: true }; });
  if (ok(r, '🏠 Rumahmu pindah ke kavling baru!')) { kavOn = false; kavSel = null; beep(700); render(); }
};
function render() {
  const db = get();
  if (!SID || !me(db)) { SID = null; authView(db); return; }
  const w = me(db); shell(db, w);
  if (view === 'map') drawGame(); else $('#main').innerHTML = (V[view] || V.home)(db, w);
}
function softRender() {
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.closest('.modal-back');
  const db = get(); if (!SID || !me(db)) { if (!typing && !$('.modal-back')) render(); return; }
  const w = me(db); if ($('#game')) shell(db, w);
  if (!typing && !$('.modal-back')) render();
  db.notifs.filter(n => n.ts > lastNotif && n.to.some(t => keys(w).includes(t))).forEach(n => toast(n.isi, n.tipe === 'ok' ? 'ok' : n.tipe === 'warn' ? 'warn' : '', n.judul)); lastNotif = Date.now();
}
FYX.onChange(softRender);
setInterval(() => {
  FYX.tick(); const db = get(), w = SID && me(db);
  if ($('#hClock')) { const hh = new Date().getHours(); $('#hClock').textContent = '🕒 ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + (hh >= 18 || hh < 6 ? ' 🌙' : ' ☀️') + ' • ' + cityDateStr(db); }
  $$('.cd').forEach(e => { const r = Math.max(0, Math.ceil((+e.dataset.cd - Date.now()) / 1000)); e.textContent = r; });
  if (w && Date.now() - w.lastSeen > 10000) update(d => { const x = me(d); if (x) x.lastSeen = Date.now(); });
}, 1000);
setInterval(() => { if (view === 'map' && $('#gcv') && !document.hidden) drawGame(); else if (!SID && $('#bgcv')) { const bg = $('#bgcv'); if (bg._cam) { bg._cam.x -= .4; redrawBg(); } } }, 300);
function redrawBg() { const bg = $('#bgcv'); if (bg && bg._last) FYX.drawMap(bg, bg._last.db, bg._last.o, true); }
window.addEventListener('beforeunload', () => { try { const d = get(), w = SID && me(d); if (w) { w.lastSeen = 0; localStorage.setItem(FYX.K, JSON.stringify(d)); } } catch (e) { } });
FYX.storageBanner(); render();
})();
</script>
